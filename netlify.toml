# Credlock Tech Support Portal – Netlify static site
[build]
  publish = "."
  command = "true"

# Do not use a catch-all redirect that hides missing assets.
# index.html is at repo root and must be published as-is.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60"
